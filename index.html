<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quadro de Agitação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Antonio:wght@500;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
  :root {
    --vinho: #520000;
    --vermelho: #810000;
    --papel: #f6f1ea;
    --papel-2: #ece4d8;
    --superficie: #fffdf9;
    --tinta: #1f1414;
    --suave: #7a6a63;
    --linha: #e0d5c7;
    --mostarda: #d9a441;
    --verde: #2f6b4f;
    --laranja: #c2571a;
    --sombra: 0 1px 2px rgba(82, 0, 0, 0.08), 0 4px 14px rgba(82, 0, 0, 0.06);
    --sombra-alta: 0 12px 32px rgba(82, 0, 0, 0.25);
    --titulo: "Anton", Impact, sans-serif;
    --subtitulo: "Antonio", "Arial Narrow", sans-serif;
    --texto: "Gotham", "Montserrat", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --papel: #170c0b;
      --papel-2: #211110;
      --superficie: #2a1614;
      --tinta: #f6f1ea;
      --suave: #b3a39a;
      --linha: #3d2320;
      --sombra: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 14px rgba(0, 0, 0, 0.3);
      --sombra-alta: 0 12px 32px rgba(0, 0, 0, 0.6);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--papel);
    color: var(--tinta);
    font-family: var(--texto);
    font-size: 14px;
    line-height: 1.45;
  }
  [hidden] { display: none !important; }
  h1, h2, h3 { margin: 0; font-weight: normal; }
  button, select, input, textarea { font: inherit; color: inherit; }
  input, select, textarea {
    background: var(--superficie);
    border: 1px solid var(--linha);
    border-radius: 8px;
    padding: 8px 10px;
    width: 100%;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--vermelho);
    box-shadow: 0 0 0 3px rgba(129, 0, 0, 0.15);
  }
  textarea { resize: vertical; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--linha);
    background: var(--superficie);
    border-radius: 8px;
    padding: 7px 12px;
    cursor: pointer;
    font-weight: 600;
    white-space: nowrap;
    transition: background .15s, border-color .15s, transform .1s;
  }
  .btn:hover { border-color: var(--vermelho); }
  .btn:active { transform: scale(0.97); }
  .btn.primario { background: var(--vermelho); border-color: var(--vermelho); color: #fff; }
  .btn.primario:hover { background: var(--vinho); }
  .btn.fantasma { background: transparent; border-color: transparent; }
  .btn.fantasma:hover { background: var(--papel-2); }
  .btn.perigo { color: #b3261e; }
  .btn svg { width: 16px; height: 16px; }
  .rotulo {
    font-family: var(--subtitulo);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: 12px;
    color: var(--suave);
  }

  /* ---------- Login ---------- */
  .tela-login {
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background:
      radial-gradient(circle at 20% 10%, var(--vermelho), transparent 60%),
      var(--vinho);
  }
  .cartao-login {
    width: min(400px, 100%);
    background: var(--superficie);
    border-radius: 14px;
    padding: 28px;
    box-shadow: var(--sombra-alta);
    display: grid;
    gap: 12px;
  }
  .marca { font-family: var(--titulo); text-transform: uppercase; line-height: 0.95; letter-spacing: 0.01em; }
  .cartao-login .marca { font-size: 44px; color: var(--vermelho); }
  .cartao-login .marca span { color: var(--tinta); display: block; font-size: 22px; font-family: var(--subtitulo); letter-spacing: 0.15em; }
  .aviso { color: var(--suave); margin: 0; }
  .modos { display: flex; gap: 4px; background: var(--papel-2); padding: 4px; border-radius: 10px; }
  .modos a {
    flex: 1; text-align: center; padding: 6px; border-radius: 7px;
    color: var(--suave); text-decoration: none; font-weight: 600; font-size: 13px;
  }
  .modos a.ativo { background: var(--superficie); color: var(--vermelho); box-shadow: var(--sombra); }

  /* ---------- Topo ---------- */
  .app { display: flex; flex-direction: column; height: 100%; }
  .topo {
    background: var(--vinho);
    color: #fff;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .topo .marca { font-size: 26px; }
  .topo .marca small { font-family: var(--subtitulo); font-size: 14px; letter-spacing: 0.15em; opacity: 0.7; margin-left: 6px; }
  .busca { flex: 1; min-width: 180px; max-width: 420px; position: relative; }
  .busca input {
    background: rgba(255, 255, 255, 0.12);
    border-color: transparent;
    color: #fff;
    padding-left: 34px;
  }
  .busca input::placeholder { color: rgba(255, 255, 255, 0.6); }
  .busca input:focus { background: rgba(255, 255, 255, 0.2); border-color: var(--mostarda); box-shadow: none; }
  .busca svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; opacity: 0.7; }
  .topo .btn { background: rgba(255, 255, 255, 0.12); border-color: transparent; color: #fff; }
  .topo .btn:hover { background: rgba(255, 255, 255, 0.22); }
  .topo .btn.ativo { background: var(--mostarda); color: var(--vinho); }
  .topo .direita { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .eu { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .selo-admin { background: var(--mostarda); color: var(--vinho); font-size: 10px; padding: 2px 6px; border-radius: 4px; font-family: var(--subtitulo); letter-spacing: 0.08em; }
  .contagem { background: var(--mostarda); color: var(--vinho); border-radius: 10px; padding: 0 6px; font-size: 11px; }

  .painel-filtros {
    background: var(--superficie);
    border-bottom: 1px solid var(--linha);
    padding: 12px 16px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
    align-items: end;
  }
  .painel-filtros label { display: grid; gap: 4px; }
  .alternar { display: flex !important; align-items: center; gap: 8px; cursor: pointer; padding: 8px 0; }
  .alternar input { width: auto; accent-color: var(--vermelho); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px 0; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--vermelho); color: #fff;
    border-radius: 20px; padding: 3px 4px 3px 10px; font-size: 12px; font-weight: 600;
  }
  .chip button { border: 0; background: rgba(255, 255, 255, 0.2); color: #fff; border-radius: 50%; width: 18px; height: 18px; cursor: pointer; line-height: 1; }

  /* ---------- Abas (celular) ---------- */
  .abas { display: none; gap: 6px; overflow-x: auto; padding: 10px 16px 0; scrollbar-width: none; }
  .abas button {
    flex: none; border: 1px solid var(--linha); background: var(--superficie);
    border-radius: 20px; padding: 5px 12px; font-weight: 600; font-size: 12px; cursor: pointer;
  }
  .abas button.ativo { background: var(--etapa); border-color: var(--etapa); color: #fff; }

  /* ---------- Quadro ---------- */
  .quadro {
    flex: 1;
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(270px, 1fr);
    gap: 14px;
    padding: 16px;
    overflow-x: auto;
    align-items: start;
  }
  .coluna {
    background: var(--papel-2);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    max-height: 100%;
    border-top: 4px solid var(--etapa);
  }
  .cab-coluna {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 12px 8px;
  }
  .cab-coluna h2 { font-family: var(--subtitulo); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; font-size: 15px; }
  .cab-coluna .num { background: var(--etapa); color: #fff; border-radius: 10px; padding: 0 8px; font-size: 12px; font-weight: 700; }
  .lista { padding: 0 10px; min-height: 60px; overflow-y: auto; display: grid; gap: 8px; align-content: start; }
  .lista:empty::before {
    content: "Arraste um cartão para cá";
    display: block; text-align: center; color: var(--suave); font-size: 12px;
    border: 2px dashed var(--linha); border-radius: 10px; padding: 18px 8px;
  }
  .rodape-coluna { padding: 8px 10px 10px; }
  .rodape-coluna .btn { width: 100%; justify-content: flex-start; color: var(--suave); }
  .rodape-coluna form { display: grid; gap: 6px; }

  .cartao {
    background: var(--superficie);
    border-radius: 10px;
    padding: 10px 12px;
    box-shadow: var(--sombra);
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: box-shadow .15s, transform .15s;
  }
  .cartao::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--cor, transparent); }
  .cartao:hover { box-shadow: var(--sombra-alta); transform: translateY(-1px); }
  .cartao .titulo { font-weight: 600; margin-bottom: 6px; word-break: break-word; }
  .cartao .etiquetas { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .tag { font-size: 11px; font-weight: 600; border-radius: 4px; padding: 1px 6px; background: var(--cor); color: #fff; }
  .tag.livre { background: var(--papel-2); color: var(--tinta); }
  .cartao .pe { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--suave); flex-wrap: wrap; }
  .cartao .pe span { display: inline-flex; align-items: center; gap: 3px; }
  .cartao .pe svg { width: 13px; height: 13px; }
  .prazo { border-radius: 4px; padding: 1px 5px; }
  .prazo.ok { background: rgba(47, 107, 79, 0.15); color: var(--verde); }
  .prazo.perto { background: rgba(217, 164, 65, 0.25); color: #8a5a00; }
  .prazo.atrasado { background: var(--vermelho); color: #fff; }
  .avatares { margin-left: auto; display: flex; }
  .avatar {
    width: 24px; height: 24px; border-radius: 50%;
    display: inline-grid; place-items: center;
    font-size: 10px; font-weight: 700; color: #fff;
    border: 2px solid var(--superficie); margin-left: -6px;
  }
  .barra { height: 4px; background: var(--papel-2); border-radius: 2px; overflow: hidden; margin-top: 8px; }
  .barra div { height: 100%; background: var(--verde); transition: width .3s; }

  .fantasma-arraste { opacity: 0.35; }
  .arrastando-agora { box-shadow: var(--sombra-alta); transform: rotate(2deg); }

  /* ---------- Gaveta do cartão ---------- */
  .fundo { position: fixed; inset: 0; background: rgba(31, 20, 20, 0.45); z-index: 20; animation: aparecer .2s; }
  .gaveta {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: min(520px, 100%);
    background: var(--papel);
    z-index: 21;
    display: flex; flex-direction: column;
    box-shadow: var(--sombra-alta);
    animation: entrar .25s ease-out;
  }
  @keyframes entrar { from { transform: translateX(40px); opacity: 0; } }
  @keyframes aparecer { from { opacity: 0; } }
  .gaveta-topo { background: var(--vinho); color: #fff; padding: 14px 16px 0; }
  .gaveta-topo .linha1 { display: flex; gap: 8px; align-items: flex-start; }
  .gaveta-topo textarea {
    font-family: var(--titulo); font-size: 24px; line-height: 1.15; text-transform: uppercase;
    background: transparent; border: 1px solid transparent; color: #fff; padding: 4px 6px; resize: none; overflow: hidden;
  }
  .gaveta-topo textarea:focus { border-color: rgba(255, 255, 255, 0.3); box-shadow: none; }
  .gaveta-topo .btn { background: rgba(255, 255, 255, 0.12); border-color: transparent; color: #fff; }
  .estado-salvo { font-size: 12px; opacity: 0.7; padding: 2px 6px; min-height: 18px; }
  .abas-gaveta { display: flex; gap: 2px; margin-top: 6px; }
  .abas-gaveta button {
    border: 0; background: transparent; color: rgba(255, 255, 255, 0.7);
    padding: 10px 14px; cursor: pointer; font-family: var(--subtitulo); font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em; border-radius: 8px 8px 0 0;
  }
  .abas-gaveta button.ativo { background: var(--papel); color: var(--vermelho); }
  .gaveta-corpo { flex: 1; overflow-y: auto; padding: 16px; display: grid; gap: 14px; align-content: start; }
  .gaveta-corpo label { display: grid; gap: 4px; }
  .grade2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grade3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media (max-width: 480px) { .grade3 { grid-template-columns: 1fr 1fr; } }
  .pessoas { display: flex; flex-wrap: wrap; gap: 6px; }
  .pessoas label {
    display: inline-flex !important; align-items: center; gap: 6px; cursor: pointer;
    border: 1px solid var(--linha); border-radius: 20px; padding: 3px 10px 3px 3px; background: var(--superficie);
  }
  .pessoas label:has(input:checked) { border-color: var(--vermelho); background: rgba(129, 0, 0, 0.08); }
  .pessoas input { display: none; }
  .pessoas .avatar { margin: 0; border: 0; }
  .links a { color: var(--vermelho); font-weight: 600; }
  .progresso-check { display: flex; align-items: center; gap: 10px; }
  .progresso-check .barra { flex: 1; margin: 0; height: 8px; }
  .lista-check { display: grid; gap: 6px; }
  .lista-check .item {
    display: flex; gap: 8px; align-items: center;
    background: var(--superficie); border: 1px solid var(--linha); border-radius: 8px; padding: 4px 4px 4px 10px;
  }
  .lista-check .item input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--verde); flex: none; }
  .lista-check .item input[type=text] { border: 0; padding: 4px; background: transparent; }
  .lista-check .item.feito input[type=text] { text-decoration: line-through; color: var(--suave); }
  .comentarios { display: grid; gap: 10px; }
  .comentario { background: var(--superficie); border-radius: 10px; padding: 10px 12px; border: 1px solid var(--linha); }
  .comentario .cab { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--suave); margin-bottom: 4px; }
  .comentario .cab b { color: var(--tinta); }
  .comentario .texto { white-space: pre-wrap; word-break: break-word; }
  .comentario .cab .btn { margin-left: auto; padding: 0 6px; }
  .gaveta-pe { border-top: 1px solid var(--linha); padding: 10px 16px; display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---------- Diálogos e avisos ---------- */
  dialog {
    width: min(640px, calc(100% - 32px));
    max-height: calc(100% - 32px);
    border: 0; border-radius: 14px;
    background: var(--papel); color: var(--tinta);
    padding: 0; box-shadow: var(--sombra-alta);
  }
  dialog::backdrop { background: rgba(31, 20, 20, 0.5); }
  .dlg-topo { background: var(--vinho); color: #fff; padding: 16px 20px; font-family: var(--titulo); font-size: 22px; text-transform: uppercase; }
  .dlg-corpo { padding: 16px 20px; display: grid; gap: 10px; }
  .dlg-corpo h3 { font-family: var(--subtitulo); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; font-size: 16px; color: var(--vermelho); margin-top: 8px; }
  .tabela { display: grid; gap: 6px; }
  .tabela > div { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--superficie); border: 1px solid var(--linha); border-radius: 8px; padding: 6px 8px; }
  .tabela .nome { flex: 1; min-width: 140px; font-weight: 600; }
  .tabela select, .tabela input { width: auto; }
  .tabela input[type=color], .linha-form input[type=color] { width: 40px; padding: 2px; height: 36px; }
  .linha-form { display: flex; gap: 6px; flex-wrap: wrap; }
  .linha-form input:not([type=color]) { flex: 1; min-width: 140px; width: auto; }
  .dlg-pe { padding: 12px 20px 16px; display: flex; justify-content: space-between; gap: 8px; }

  .avisos { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 50; display: grid; gap: 8px; justify-items: center; pointer-events: none; }
  .toast {
    background: var(--tinta); color: var(--papel);
    padding: 10px 16px; border-radius: 10px; box-shadow: var(--sombra-alta);
    font-weight: 600; animation: subir .25s ease-out;
  }
  .toast.erro { background: #b3261e; color: #fff; }
  @keyframes subir { from { transform: translateY(12px); opacity: 0; } }

  @media (max-width: 767px) {
    .topo .marca small, .eu .nome-eu { display: none; }
    .busca { order: 3; max-width: none; flex-basis: 100%; }
    .abas { display: flex; }
    .quadro {
      grid-auto-columns: calc(100% - 32px);
      scroll-snap-type: x mandatory;
      padding: 12px 16px;
    }
    .coluna { scroll-snap-align: center; }
  }
</style>
</head>
<body>

<!-- ---------- Login ---------- -->
<section class="tela-login" id="telaLogin" hidden>
  <form class="cartao-login" id="formLogin">
    <div class="marca">Quadro<span>de agitação</span></div>
    <div class="modos">
      <a href="#" data-modo="entrar" class="ativo">Entrar</a>
      <a href="#" data-modo="criar">Criar conta</a>
      <a href="#" data-modo="esqueci">Esqueci a senha</a>
    </div>
    <p class="aviso" id="instrucaoLogin">Entre com seu e-mail e senha.</p>
    <input type="email" id="emailLogin" required placeholder="voce@proton.me" autocomplete="email">
    <input id="nomeLogin" placeholder="Seu nome" autocomplete="name" hidden>
    <input type="password" id="senhaLogin" required minlength="8" placeholder="Senha (mínimo 8 caracteres)" autocomplete="current-password">
    <button class="btn primario" type="submit" id="botaoLogin" style="justify-content:center">Entrar</button>
    <p class="aviso" id="msgLogin"></p>
  </form>
</section>

<section class="tela-login" id="telaSemAcesso" hidden>
  <div class="cartao-login">
    <div class="marca" id="tituloSemAcesso">Sem acesso</div>
    <p class="aviso" id="textoSemAcesso"></p>
    <button class="btn" data-sair>Sair</button>
  </div>
</section>

<dialog id="dlgSenha">
  <form id="formSenha">
    <div class="dlg-topo">Nova senha</div>
    <div class="dlg-corpo">
      <input type="password" id="novaSenha" required minlength="8" placeholder="Nova senha" autocomplete="new-password">
    </div>
    <div class="dlg-pe"><span></span><button class="btn primario" type="submit">Salvar senha</button></div>
  </form>
</dialog>

<!-- ---------- Quadro ---------- -->
<div class="app" id="app" hidden>
  <header class="topo">
    <div class="marca">Quadro<small>de agitação</small></div>
    <div class="busca">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="busca" placeholder="Buscar título, briefing ou etiqueta…" aria-label="Buscar">
    </div>
    <div class="direita">
      <button class="btn" id="botaoFiltros">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
        Filtros
      </button>
      <button class="btn" id="abrirAdmin" hidden>Administração</button>
      <span class="eu"><span class="avatar" id="meuAvatar"></span><span class="nome-eu" id="eu"></span></span>
      <button class="btn" data-sair title="Sair">Sair</button>
    </div>
  </header>

  <div class="painel-filtros" id="painelFiltros" hidden>
    <label><span class="rotulo">Tipo</span><select id="filtroTipo"></select></label>
    <label><span class="rotulo">Campanha</span><select id="filtroCampanha"></select></label>
    <label><span class="rotulo">Responsável</span><select id="filtroPessoa"></select></label>
    <label class="alternar"><input type="checkbox" id="meus"> Só os meus cartões</label>
    <label class="alternar"><input type="checkbox" id="verArquivados"> Ver arquivados</label>
  </div>
  <div class="chips" id="chips" hidden></div>
  <nav class="abas" id="abas"></nav>
  <main class="quadro" id="quadro"></main>
</div>

<!-- ---------- Gaveta do cartão ---------- -->
<div class="fundo" id="fundo" hidden></div>
<aside class="gaveta" id="gaveta" hidden aria-label="Cartão">
  <div class="gaveta-topo">
    <div class="linha1">
      <textarea id="cTitulo" rows="1" aria-label="Título"></textarea>
      <button class="btn" id="fecharGaveta" title="Fechar">✕</button>
    </div>
    <div class="estado-salvo" id="estadoSalvo"></div>
    <div class="abas-gaveta" id="abasGaveta">
      <button data-aba="detalhes" class="ativo">Detalhes</button>
      <button data-aba="checklist">Checklist <span id="contaCheck"></span></button>
      <button data-aba="comentarios">Comentários</button>
    </div>

  <div class="gaveta-corpo" data-painel="detalhes">
    <div class="grade3">
      <label><span class="rotulo">Etapa</span><select id="cColuna"></select></label>
      <label><span class="rotulo">Tipo</span><select id="cTipo"></select></label>
      <label><span class="rotulo">Campanha</span><select id="cCampanha"></select></label>

      <label><span class="rotulo">Prazo</span><input type="date" id="cPrazo"></label>
      <label><span class="rotulo">Publicação</span><input type="date" id="cPublicacao"></label>
    </div>
    <div><span class="rotulo">Responsáveis</span><div class="pessoas" id="cPessoas" style="margin-top:6px"></div></div>

      <textarea id="cBriefing" rows="5"></textarea>
    </label>

      <input id="cEtiquetas" placeholder="urgente, Instagram, impresso">
    </label>

      <textarea id="cLinks" rows="3" placeholder="Drive | https://drive.google.com/…"></textarea>

    <div class="lista-check" id="cChecklist"></div>

  <div class="gaveta-corpo" data-painel="comentarios" hidden>
    <div class="comentarios" id="cComentarios"></div>
    <textarea id="cNovoComentario" rows="3" placeholder="Escreva um comentário…"></textarea>
    <div><button class="btn primario" id="cComentar">Enviar comentário</button></div>
  </div>

  <div class="gaveta-pe">
    <button class="btn" id="cDuplicar">Duplicar</button>
    <button class="btn" id="cArquivar" hidden>Arquivar</button>
    <button class="btn perigo" id="cExcluir" hidden style="margin-left:auto">Excluir</button>

</aside>

<!-- ---------- Administração ---------- -->
<dialog id="dlgAdmin">
  <div class="dlg-topo">Administração</div>
  <div class="dlg-corpo">
    <h3>Membros</h3>
    <p class="aviso">Cada pessoa cria a própria conta com e-mail do Proton. Aprove aqui quem pode entrar.</p>
    <div class="tabela" id="aPessoas"></div>

    <h3>Campanhas</h3>
    <div class="tabela" id="aCampanhas"></div>
    <form class="linha-form" id="aFormCampanha">
      <input id="aCampNome" required placeholder="Nome da campanha">
      <input type="color" id="aCampCor" value="#810000" aria-label="Cor">
      <button class="btn" type="submit">Adicionar</button>

      <input id="aTipoNome" required placeholder="Nome do tipo">
      <input type="color" id="aTipoCor" value="#520000" aria-label="Cor">
      <input id="aTipoCheck" placeholder="Etapas separadas por vírgula">
      <button class="btn" type="submit">Adicionar</button>
    </form>

    <form method="dialog"><button class="btn primario">Fechar</button></form>
  </div>
</dialog>

<div class="avisos" id="avisos"></div>

<script>
  const sb = supabase.createClient(
    "https://onbmvsdbptgamrwptvww.supabase.co",
    "sb_publishable_dAHH6jacP-214UJyZmAm7g_vViAWYfg"
  );

  const COLUNAS = [
    { id: "ideias", nome: "Ideias / Pautas", cor: "#8a7f72" },
    { id: "roteiro", nome: "Roteiro / Briefing", cor: "#b8862b" },
    { id: "producao", nome: "Em produção", cor: "#810000" },
    { id: "revisao", nome: "Revisão", cor: "#c2571a" },
    { id: "aprovado", nome: "Aprovado", cor: "#2f6b4f" },
    { id: "publicado", nome: "Publicado / Colado", cor: "#520000" },
  ];
  const CORES_AVATAR = ["#810000", "#520000", "#b8862b", "#2f6b4f", "#c2571a", "#5b4a8a", "#2d5f7a"];
  const ICONE = {
    prazo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    publicacao: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 4 4 10-10"/></svg>',
    link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 14a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1M14 10a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1"/></svg>',
  };

  const $ = id => document.getElementById(id);
  let eu = null, admin = false, meuNome = "";
  let membros = [], pessoas = [], tipos = [], campanhas = [], cartoes = [];
  let editando = null, checklistEdit = [];
  let canal = null, recarga = null, arrastando = false, salvarTimer = null;

  // ---------- Avisos ----------

  function aviso(msg, erro) {
    const t = document.createElement("div");
    t.className = "toast" + (erro ? " erro" : "");
    t.textContent = msg;
    $("avisos").append(t);
    setTimeout(() => t.remove(), erro ? 5000 : 2200);
  }

  // ---------- Login ----------
  // Cadastro próprio com e-mail do Proton; o admin aprova cada conta nova.
  // O banco também recusa outros domínios (supabase-v3.sql).
  const DOMINIOS = ["proton.me", "protonmail.com", "pm.me", "protonmail.ch"];
  const DOMINIO = "do Proton (@proton.me, @protonmail.com, @pm.me ou @protonmail.ch)";
  let modo = "entrar";

  sb.auth.onAuthStateChange((evento, sessao) => {
    if (evento === "PASSWORD_RECOVERY") setTimeout(() => $("dlgSenha").showModal(), 0);
    if (["INITIAL_SESSION", "SIGNED_IN", "SIGNED_OUT"].includes(evento)) {
      setTimeout(() => entrar(sessao), 0);
    }
  });

  document.querySelectorAll("[data-modo]").forEach(a => a.addEventListener("click", e => {
    e.preventDefault();
    modo = a.dataset.modo;
    document.querySelectorAll("[data-modo]").forEach(x => x.classList.toggle("ativo", x === a));
    $("nomeLogin").hidden = modo !== "criar";
    $("nomeLogin").required = modo === "criar";
    $("senhaLogin").hidden = modo === "esqueci";
    $("senhaLogin").required = modo !== "esqueci";
    $("senhaLogin").autocomplete = modo === "criar" ? "new-password" : "current-password";
    $("botaoLogin").textContent = { entrar: "Entrar", criar: "Criar conta", esqueci: "Enviar link" }[modo];
    $("instrucaoLogin").textContent = {
      entrar: "Entre com seu e-mail e senha.",
      criar: "Crie sua conta com um e-mail " + DOMINIO + ". O administrador libera o acesso.",
      esqueci: "Enviaremos um link para você criar uma nova senha.",
    }[modo];
    $("msgLogin").textContent = "";
  }));

  $("formLogin").addEventListener("submit", async e => {
    e.preventDefault();
    const msg = $("msgLogin");
    const email = $("emailLogin").value.trim().toLowerCase();
    const password = $("senhaLogin").value;
    if (modo === "criar" && !DOMINIOS.includes(email.split("@")[1])) {
      msg.textContent = "Use um e-mail " + DOMINIO + ".";
      return;
    }
    msg.textContent = "Aguarde…";
    let r;
    if (modo === "entrar") r = await sb.auth.signInWithPassword({ email, password });
    if (modo === "criar") r = await sb.auth.signUp({ email, password, options: { data: { nome: $("nomeLogin").value.trim() } } });
    if (modo === "esqueci") r = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    $("senhaLogin").value = "";
    if (r.error) {
      msg.textContent = modo === "entrar" ? "E-mail ou senha incorretos." : "Não deu certo: " + r.error.message;
    } else if (modo === "esqueci") {
      msg.textContent = "Pronto! Abra o link que chegou no seu e-mail.";
    } else if (modo === "criar" && !r.data.session) {
      msg.textContent = "Conta criada! Confirme pelo link no seu e-mail e depois entre.";
    } else {
      msg.textContent = "";
    }
  });

  $("formSenha").addEventListener("submit", async e => {
    e.preventDefault();
    const { error } = await sb.auth.updateUser({ password: $("novaSenha").value });
    if (error) return aviso("Não deu certo: " + error.message, true);
    $("dlgSenha").close();
    aviso("Senha alterada.");
  });

  document.querySelectorAll("[data-sair]").forEach(b =>
    b.addEventListener("click", () => sb.auth.signOut()));

  function mostrar(tela) {
    for (const id of ["telaLogin", "telaSemAcesso", "app"]) $(id).hidden = id !== tela;
  }

  async function entrar(sessao) {
    if (!sessao) {
      eu = null;
      if (canal) { sb.removeChannel(canal); canal = null; }
      return mostrar("telaLogin");
    }
    eu = sessao.user.email.toLowerCase();
    const { data } = await sb.from("membros").select("*").eq("email", eu).maybeSingle();
    if (!data || data.papel === "pendente") {
      $("tituloSemAcesso").textContent = data ? "Aguardando aprovação" : "Sem acesso";
      $("textoSemAcesso").textContent = data
        ? "Sua conta (" + eu + ") foi criada. Quando o administrador aprovar, é só recarregar a página."
        : "O e-mail " + eu + " não tem acesso a este quadro.";
      return mostrar("telaSemAcesso");
    }
    admin = data.papel === "admin";
    meuNome = data.nome || eu;
    $("eu").innerHTML = "";
    $("eu").append(meuNome);
    if (admin) { const s = texto("ADMIN"); s.className = "selo-admin"; $("eu").append(" ", s); }
    pintarAvatar($("meuAvatar"), meuNome);
    $("abrirAdmin").hidden = !admin;
    mostrar("app");
    await carregarTudo();
    if (!canal) {
      canal = sb.channel("cartoes")
        .on("postgres_changes", { event: "*", schema: "public", table: "cartoes" }, () => {
          clearTimeout(recarga);
          recarga = setTimeout(carregarCartoes, 400);
        })
        .subscribe();
    }
  }

  // ---------- Dados ----------

  async function carregarTudo() {
    const [m, t, c] = await Promise.all([
      sb.from("membros").select("*").order("nome"),
      sb.from("tipos").select("*").order("nome"),
      sb.from("campanhas").select("*").order("criado_em"),
    ]);
    membros = m.data || [];
    pessoas = membros.filter(x => x.papel !== "pendente").map(x => ({ nome: x.nome || x.email }));
    tipos = t.data || [];
    campanhas = c.data || [];
    const pendentes = membros.filter(x => x.papel === "pendente").length;
    $("abrirAdmin").innerHTML = "Administração" + (pendentes ? ' <span class="contagem">' + pendentes + "</span>" : "");
    montarFiltros();
    await carregarCartoes();
  }

  async function carregarCartoes() {
    // Não redesenha no meio de um arraste nem por cima do que alguém está digitando.
    if (arrastando || salvarTimer) { clearTimeout(recarga); recarga = setTimeout(carregarCartoes, 800); return; }
    const { data, error } = await sb.from("cartoes").select("*").order("ordem");
    if (error) return aviso("Erro ao carregar: " + error.message, true);
    cartoes = data;
    desenhar();
    if (editando) {
      const atual = cartoes.find(c => c.id === editando.id);
      if (atual) editando = atual;
    }
  }

  async function gravar(acao) {
    const { error } = await acao;
    if (error) {
      aviso("Não foi possível salvar: " + error.message, true);
      await carregarCartoes();
      return false;
    }
    return true;
  }

  // ---------- Utilidades ----------

  const tipoDe = id => tipos.find(t => t.id === id);
  const campanhaDe = id => campanhas.find(c => c.id === id);
  const colunaDe = id => COLUNAS.find(c => c.id === id) || COLUNAS[0];
  const iniciais = nome => nome.split(/[\s@.]+/).filter(Boolean).slice(0, 2).map(p => p[0].toUpperCase()).join("");
  const hoje = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const dataBR = d => d.split("-").reverse().slice(0, 2).join("/");
  const separar = s => s.split(",").map(x => x.trim()).filter(Boolean);
  const diasAte = d => Math.round((new Date(d) - new Date(hoje())) / 86400000);

  function pintarAvatar(el, nome) {
    let h = 0;
    for (const ch of nome) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    el.style.background = CORES_AVATAR[h % CORES_AVATAR.length];
    el.textContent = iniciais(nome);
    el.title = nome;
    return el;
  }
  function avatar(nome) { const s = document.createElement("span"); s.className = "avatar"; return pintarAvatar(s, nome); }
  function texto(t) { const s = document.createElement("span"); s.textContent = t; return s; }
  function tag(t, cor, livre) {
    const s = texto(t);
    s.className = "tag" + (livre ? " livre" : "");
    if (cor) s.style.setProperty("--cor", cor);
    return s;
  }
  function botao(rotulo, acao, classe) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "btn " + (classe || "");
    b.textContent = rotulo;
    b.addEventListener("click", acao);
    return b;
  }
  function opcoes(select, itens, vazio) {
    const atual = select.value;
    select.innerHTML = "";
    if (vazio !== null) select.append(new Option(vazio, ""));
    itens.forEach(([valor, rotulo]) => select.append(new Option(rotulo, valor)));
    select.value = itens.some(([v]) => v === atual) ? atual : (vazio !== null ? "" : itens[0][0]);
  }

  // ---------- Filtros ----------

  function montarFiltros() {
    opcoes($("filtroTipo"), tipos.map(t => [t.id, t.nome]), "Todos");
    opcoes($("filtroCampanha"), campanhas.filter(c => !c.arquivada).map(c => [c.id, c.nome]), "Todas");
    opcoes($("filtroPessoa"), pessoas.map(p => [p.nome, p.nome]), "Todas");
  }

  $("botaoFiltros").addEventListener("click", () => {
    $("painelFiltros").hidden = !$("painelFiltros").hidden;
    $("botaoFiltros").classList.toggle("ativo", !$("painelFiltros").hidden);
  });
  ["filtroTipo", "filtroCampanha", "filtroPessoa", "verArquivados", "meus"].forEach(id =>
    $(id).addEventListener("change", desenhar));
  $("busca").addEventListener("input", desenhar);

  function desenharChips() {
    const chips = $("chips");
    chips.innerHTML = "";
    const ativos = [
      ["filtroTipo", v => "Tipo: " + (tipoDe(v) || {}).nome],
      ["filtroCampanha", v => "Campanha: " + (campanhaDe(v) || {}).nome],
      ["filtroPessoa", v => "Responsável: " + v],
    ].filter(([id]) => $(id).value);
    ativos.forEach(([id, rotulo]) => chips.append(chip(rotulo($(id).value), () => { $(id).value = ""; })));
    if ($("meus").checked) chips.append(chip("Só os meus", () => { $("meus").checked = false; }));
    if ($("verArquivados").checked) chips.append(chip("Arquivados", () => { $("verArquivados").checked = false; }));
    chips.hidden = !chips.children.length;
  }
  function chip(rotulo, limpar) {
    const c = document.createElement("span");
    c.className = "chip";
    c.append(rotulo, botao("×", () => { limpar(); desenhar(); }));
    c.querySelector("button").className = "";
    return c;
  }

  function visiveis() {
    const tipo = $("filtroTipo").value, camp = $("filtroCampanha").value, pessoa = $("filtroPessoa").value;
    const arq = $("verArquivados").checked, meus = $("meus").checked;
    const busca = $("busca").value.trim().toLowerCase();
    return cartoes.filter(c =>
      c.arquivado === arq &&
      (!tipo || c.tipo_id === tipo) &&
      (!camp || c.campanha_id === camp) &&
      (!pessoa || c.responsaveis.includes(pessoa)) &&
      (!meus || c.responsaveis.includes(meuNome)) &&
      (!busca || [c.titulo, c.briefing, ...(c.etiquetas || [])].join(" ").toLowerCase().includes(busca)));
  }

  // ---------- Quadro ----------

  function desenhar() {
    desenharChips();
    const quadro = $("quadro");
    const rolagem = quadro.scrollLeft;
    quadro.innerHTML = "";
    $("abas").innerHTML = "";
    const lista = visiveis();
    const arquivados = $("verArquivados").checked;

    COLUNAS.forEach((col, i) => {
      const doCol = lista.filter(c => c.coluna === col.id);
      const el = document.createElement("section");
      el.className = "coluna";
      el.style.setProperty("--etapa", col.cor);

      const cab = document.createElement("div");
      cab.className = "cab-coluna";
      const h = document.createElement("h2");
      h.textContent = col.nome;
      const num = texto(doCol.length);
      num.className = "num";
      cab.append(h, num);

      const ul = document.createElement("div");
      ul.className = "lista";
      ul.dataset.coluna = col.id;
      doCol.forEach(c => ul.append(desenharCartao(c)));

      el.append(cab, ul);
      if (!arquivados) el.append(rodapeColuna(col));
      quadro.append(el);

      const aba = document.createElement("button");
      aba.textContent = col.nome.split(" /")[0] + " · " + doCol.length;
      aba.style.setProperty("--etapa", col.cor);
      aba.addEventListener("click", () => el.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" }));
      $("abas").append(aba);

      if (!arquivados) {
        Sortable.create(ul, {
          group: "cartoes",
          animation: 180,
          delay: 180,
          delayOnTouchOnly: true,
          ghostClass: "fantasma-arraste",
          dragClass: "arrastando-agora",
          onStart: () => { arrastando = true; },
          onEnd: evt => {
            arrastando = false;
            soltar(evt.item.dataset.id, evt.to);
          },
        });
      }
    });
    quadro.scrollLeft = rolagem;
    marcarAba();
  }

  function marcarAba() {
    const quadro = $("quadro");
    const largura = quadro.firstElementChild ? quadro.firstElementChild.offsetWidth + 14 : 1;
    const i = Math.round(quadro.scrollLeft / largura);
    [...$("abas").children].forEach((b, j) => b.classList.toggle("ativo", i === j));
  }
  $("quadro").addEventListener("scroll", marcarAba, { passive: true });

  function rodapeColuna(col) {
    const pe = document.createElement("div");
    pe.className = "rodape-coluna";
    const abrir = botao("+ Adicionar cartão", () => {
      abrir.hidden = true;
      form.hidden = false;
      form.querySelector("textarea").focus();
    }, "fantasma");
    const form = document.createElement("form");
    form.hidden = true;
    form.innerHTML = '<textarea rows="2" placeholder="Título do cartão… (Enter para salvar)"></textarea>';
    const area = form.querySelector("textarea");
    const fechar = () => { form.hidden = true; abrir.hidden = false; area.value = ""; };
    const acoes = document.createElement("div");
    acoes.style.cssText = "display:flex;gap:6px";
    acoes.append(botao("Adicionar", () => form.requestSubmit(), "primario"), botao("Cancelar", fechar, "fantasma"));
    form.append(acoes);
    area.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
      if (e.key === "Escape") fechar();
    });
    form.addEventListener("submit", async e => {
      e.preventDefault();
      const titulo = area.value.trim();
      if (!titulo) return;
      area.value = "";
      const tipo = $("filtroTipo").value || null;
      const ultimo = cartoes.filter(c => c.coluna === col.id).pop();
      const { data, error } = await sb.from("cartoes").insert({
        titulo,
        coluna: col.id,
        ordem: ultimo ? ultimo.ordem + 1 : Date.now() / 1000,
        tipo_id: tipo,
        campanha_id: $("filtroCampanha").value || null,
        responsaveis: $("meus").checked ? [meuNome] : [],
        checklist: tipo ? checklistPadrao(tipo) : [],
      }).select().single();
      if (error) return aviso("Não foi possível criar: " + error.message, true);
      cartoes.push(data);
      desenhar();
      const novo = [...$("quadro").querySelectorAll(".lista")].find(l => l.dataset.coluna === col.id);
      const f = novo.parentElement.querySelector(".rodape-coluna");
      f.querySelector(".btn.fantasma").hidden = true;
      f.querySelector("form").hidden = false;
      f.querySelector("textarea").focus();
    });
    pe.append(abrir, form);
    return pe;
  }

  function desenharCartao(c) {
    const card = document.createElement("article");
    card.className = "cartao";
    card.dataset.id = c.id;
    const tipo = tipoDe(c.tipo_id), camp = campanhaDe(c.campanha_id);
    if (tipo) card.style.setProperty("--cor", tipo.cor);

    const tags = document.createElement("div");
    tags.className = "etiquetas";
    if (tipo) tags.append(tag(tipo.nome, tipo.cor));
    if (camp) tags.append(tag(camp.nome, camp.cor));
    (c.etiquetas || []).forEach(t => tags.append(tag(t, null, true)));

    const titulo = document.createElement("div");
    titulo.className = "titulo";
    titulo.textContent = c.titulo;

    const pe = document.createElement("div");
    pe.className = "pe";
    if (c.prazo) {
      const dias = diasAte(c.prazo);
      const s = document.createElement("span");
      s.className = "prazo " + (c.coluna === "publicado" ? "ok" : dias < 0 ? "atrasado" : dias <= 2 ? "perto" : "ok");
      s.innerHTML = ICONE.prazo;
      s.append(dataBR(c.prazo));
      s.title = dias < 0 ? "Atrasado" : "Prazo";
      pe.append(s);
    }
    if (c.data_publicacao) {
      const s = document.createElement("span");
      s.innerHTML = ICONE.publicacao;
      s.append(dataBR(c.data_publicacao));
      s.title = "Publicação";
      pe.append(s);
    }
    if (c.links.length) {
      const s = document.createElement("span");
      s.innerHTML = ICONE.link;
      s.append(c.links.length);
      pe.append(s);
    }
    const feitos = c.checklist.filter(i => i.feito).length;
    if (c.checklist.length) {
      const s = document.createElement("span");
      s.innerHTML = ICONE.check;
      s.append(feitos + "/" + c.checklist.length);
      pe.append(s);
    }
    if (c.responsaveis.length) {
      const av = document.createElement("span");
      av.className = "avatares";
      c.responsaveis.forEach(n => av.append(avatar(n)));
      pe.append(av);
    }

    if (tags.children.length) card.append(tags);
    card.append(titulo);
    if (pe.children.length) card.append(pe);
    if (c.checklist.length) {
      const barra = document.createElement("div");
      barra.className = "barra";
      barra.innerHTML = '<div style="width:' + Math.round(feitos / c.checklist.length * 100) + '%"></div>';
      card.append(barra);
    }
    card.addEventListener("click", () => abrirCartao(c.id));
    return card;
  }

  async function soltar(id, listaEl) {
    const c = cartoes.find(x => x.id === id);
    if (!c) return;
    const coluna = listaEl.dataset.coluna;
    const ids = [...listaEl.children].map(el => el.dataset.id);
    const i = ids.indexOf(id);
    const antes = cartoes.find(x => x.id === ids[i - 1]);
    const depois = cartoes.find(x => x.id === ids[i + 1]);
    let ordem;
    if (antes && depois) ordem = (antes.ordem + depois.ordem) / 2;
    else if (antes) ordem = antes.ordem + 1;
    else if (depois) ordem = depois.ordem - 1;
    else ordem = Date.now() / 1000;
    const mudouColuna = c.coluna !== coluna;
    c.coluna = coluna;
    c.ordem = ordem;
    cartoes.sort((a, b) => a.ordem - b.ordem);
    desenhar();
    if (await gravar(sb.from("cartoes").update({ coluna, ordem }).eq("id", id)) && mudouColuna) {
      aviso("Movido para " + colunaDe(coluna).nome);
    }
  }

  // ---------- Gaveta do cartão ----------

  const checklistPadrao = tipoId => ((tipoDe(tipoId) || {}).checklist || []).map(item => ({ item, feito: false }));

  function abrirCartao(id) {
    const c = cartoes.find(x => x.id === id);
    if (!c) return;
    editando = c;
    $("cTitulo").value = c.titulo;
    opcoes($("cColuna"), COLUNAS.map(col => [col.id, col.nome]), null);
    $("cColuna").value = c.coluna;
    opcoes($("cTipo"), tipos.map(t => [t.id, t.nome]), "Sem tipo");
    $("cTipo").value = c.tipo_id || "";
    opcoes($("cCampanha"), campanhas.filter(x => !x.arquivada || x.id === c.campanha_id).map(x => [x.id, x.nome]), "Sem campanha");
    $("cCampanha").value = c.campanha_id || "";
    $("cPrazo").value = c.prazo || "";
    $("cPublicacao").value = c.data_publicacao || "";
    $("cBriefing").value = c.briefing;
    $("cEtiquetas").value = (c.etiquetas || []).join(", ");
    $("cLinks").value = c.links.map(l => (l.rotulo && l.rotulo !== l.url ? l.rotulo + " | " : "") + l.url).join("\n");
    mostrarLinks(c.links);

    $("cPessoas").innerHTML = "";
    const nomes = [...new Set([...pessoas.map(p => p.nome), ...c.responsaveis])];
    nomes.forEach(nome => {
      const l = document.createElement("label");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.value = nome;
      cb.checked = c.responsaveis.includes(nome);
      l.append(cb, avatar(nome), nome);
      $("cPessoas").append(l);
    });

    checklistEdit = c.checklist.map(i => ({ ...i }));
    desenharChecklist();
    $("cNovoComentario").value = "";
    $("estadoSalvo").textContent = c.arquivado ? "Arquivado" : "";
    $("cExcluir").hidden = !admin;
    $("cArquivar").hidden = !admin;
    $("cArquivar").textContent = c.arquivado ? "Desarquivar" : "Arquivar";
    trocarAba("detalhes");
    $("fundo").hidden = false;
    $("gaveta").hidden = false;
    ajustarTitulo();
    carregarComentarios();
  }

  async function fecharGaveta() {
    if (salvarTimer) { clearTimeout(salvarTimer); await salvar(); }
    $("gaveta").hidden = true;
    $("fundo").hidden = true;
    editando = null;
    desenhar();
  }
  $("fecharGaveta").addEventListener("click", fecharGaveta);
  $("fundo").addEventListener("click", fecharGaveta);
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && !$("gaveta").hidden && !document.querySelector("dialog[open]")) fecharGaveta();
  });

  function trocarAba(aba) {
    document.querySelectorAll("#abasGaveta button").forEach(b => b.classList.toggle("ativo", b.dataset.aba === aba));
    document.querySelectorAll("[data-painel]").forEach(p => p.hidden = p.dataset.painel !== aba);
  }
  document.querySelectorAll("#abasGaveta button").forEach(b => b.addEventListener("click", () => trocarAba(b.dataset.aba)));

  function ajustarTitulo() {
    const t = $("cTitulo");
    t.style.height = "auto";
    t.style.height = t.scrollHeight + "px";
  }
  $("cTitulo").addEventListener("input", ajustarTitulo);
  $("cTitulo").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); e.target.blur(); } });

  // Salvamento automático: qualquer mudança na gaveta grava sozinha depois de uma pausa curta.
  function agendarSalvar() {
    $("estadoSalvo").textContent = "Salvando…";
    clearTimeout(salvarTimer);
    salvarTimer = setTimeout(salvar, 700);
  }
  ["cTitulo", "cBriefing", "cEtiquetas", "cLinks"].forEach(id => $(id).addEventListener("input", agendarSalvar));
  ["cColuna", "cTipo", "cCampanha", "cPrazo", "cPublicacao"].forEach(id => $(id).addEventListener("change", agendarSalvar));
  $("cPessoas").addEventListener("change", agendarSalvar);
  $("cLinks").addEventListener("input", () => mostrarLinks(lerLinks()));

  $("cTipo").addEventListener("change", () => {
    if (!checklistEdit.length) { checklistEdit = checklistPadrao($("cTipo").value); desenharChecklist(); }
  });

  async function salvar() {
    salvarTimer = null;
    if (!editando) return;
    const titulo = $("cTitulo").value.trim();
    if (!titulo) { $("estadoSalvo").textContent = "O título não pode ficar vazio."; return; }
    const dados = {
      titulo,
      tipo_id: $("cTipo").value || null,
      campanha_id: $("cCampanha").value || null,
      coluna: $("cColuna").value,
      prazo: $("cPrazo").value || null,
      data_publicacao: $("cPublicacao").value || null,
      responsaveis: [...$("cPessoas").querySelectorAll("input:checked")].map(cb => cb.value),
      briefing: $("cBriefing").value,
      etiquetas: separar($("cEtiquetas").value),
      links: lerLinks(),
      checklist: checklistEdit.filter(i => i.item.trim()),
    };
    const { error } = await sb.from("cartoes").update(dados).eq("id", editando.id);
    if (error) {
      $("estadoSalvo").textContent = "Erro ao salvar";
      return aviso("Não foi possível salvar: " + error.message, true);
    }
    Object.assign(editando, dados);
    $("estadoSalvo").textContent = "Salvo ✓";
    desenhar();
  }

  function desenharChecklist() {
    const lista = $("cChecklist");
    lista.innerHTML = "";
    checklistEdit.forEach((etapa, i) => {
      const linha = document.createElement("div");
      linha.className = "item" + (etapa.feito ? " feito" : "");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = etapa.feito;
      cb.addEventListener("change", () => {
        etapa.feito = cb.checked;
        linha.classList.toggle("feito", cb.checked);
        progressoChecklist();
        agendarSalvar();
      });
      const inp = document.createElement("input");
      inp.type = "text";
      inp.value = etapa.item;
      inp.placeholder = "Nova etapa";
      inp.addEventListener("input", () => { etapa.item = inp.value; agendarSalvar(); });
      inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("cAddEtapa").click(); } });
      linha.append(cb, inp, botao("✕", () => { checklistEdit.splice(i, 1); desenharChecklist(); agendarSalvar(); }, "fantasma"));
      lista.append(linha);
    });
    progressoChecklist();
  }

  function progressoChecklist() {
    const total = checklistEdit.length, feitos = checklistEdit.filter(i => i.feito).length;
    $("barraCheck").style.width = (total ? Math.round(feitos / total * 100) : 0) + "%";
    $("textoCheck").textContent = total ? feitos + " de " + total : "Nenhuma etapa";
    $("contaCheck").textContent = total ? "(" + feitos + "/" + total + ")" : "";
  }

  $("cAddEtapa").addEventListener("click", () => {
    checklistEdit.push({ item: "", feito: false });
    desenharChecklist();
    $("cChecklist").lastElementChild.querySelector("input[type=text]").focus();
  });

  function lerLinks() {
    return $("cLinks").value.split("\n").map(l => l.trim()).filter(Boolean).map(l => {
      const partes = l.split("|");
      const url = partes.pop().trim();
      return { rotulo: partes.join("|").trim() || url, url };
    }).filter(l => /^https?:\/\//i.test(l.url));
  }

  function mostrarLinks(links) {
    const el = $("cLinksVer");
    el.innerHTML = "";
    links.forEach((l, i) => {
      const a = document.createElement("a");
      a.href = l.url;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = l.rotulo;
      if (i) el.append(" · ");
      el.append(a);
    });
  }

  $("cDuplicar").addEventListener("click", async () => {
    if (salvarTimer) { clearTimeout(salvarTimer); await salvar(); }
    const { id, criado_em, atualizado_em, criado_por, ...resto } = editando;
    const copia = {
      ...resto,
      titulo: editando.titulo + " (cópia)",
      ordem: editando.ordem + 0.001,
      arquivado: false,
      checklist: editando.checklist.map(i => ({ ...i, feito: false })),
    };
    const { data, error } = await sb.from("cartoes").insert(copia).select().single();
    if (error) return aviso("Não foi possível duplicar: " + error.message, true);
    cartoes.push(data);
    cartoes.sort((a, b) => a.ordem - b.ordem);
    aviso("Cartão duplicado");
    abrirCartao(data.id);
    desenhar();
  });

  $("cArquivar").addEventListener("click", async () => {
    const arquivado = !editando.arquivado;
    if (await gravar(sb.from("cartoes").update({ arquivado }).eq("id", editando.id))) {
      editando.arquivado = arquivado;
      aviso(arquivado ? "Cartão arquivado" : "Cartão desarquivado");
      fecharGaveta();
    }
  });

  $("cExcluir").addEventListener("click", async () => {
    if (!confirm("Excluir este cartão de vez? Para guardar, use Arquivar.")) return;
    const id = editando.id;
    clearTimeout(salvarTimer);
    salvarTimer = null;
    if (await gravar(sb.from("cartoes").delete().eq("id", id))) {
      cartoes = cartoes.filter(c => c.id !== id);
      aviso("Cartão excluído");
      fecharGaveta();
    }
  });

  // ---------- Comentários ----------

  async function carregarComentarios() {
    const el = $("cComentarios");
    const id = editando.id;
    el.textContent = "Carregando…";
    const { data, error } = await sb.from("comentarios").select("*").eq("cartao_id", id).order("criado_em");
    if (!editando || editando.id !== id) return;
    el.innerHTML = "";
    if (error) return el.append(texto("Erro: " + error.message));
    if (!data.length) { const v = texto("Nenhum comentário ainda."); v.className = "aviso"; el.append(v); }
    data.forEach(c => {
      const box = document.createElement("div");
      box.className = "comentario";
      const cab = document.createElement("div");
      cab.className = "cab";
      const quem = document.createElement("b");
      quem.textContent = c.autor || "Alguém";
      const quando = new Date(c.criado_em).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" });
      cab.append(avatar(c.autor || "?"), quem, quando);
      if (admin) cab.append(botao("✕", async () => {
        if (confirm("Apagar este comentário?") && await gravar(sb.from("comentarios").delete().eq("id", c.id)))
          carregarComentarios();
      }, "fantasma"));
      const t = document.createElement("div");
      t.className = "texto";
      t.textContent = c.texto;
      box.append(cab, t);
      el.append(box);
    });
  }

  $("cComentar").addEventListener("click", async () => {
    const txt = $("cNovoComentario").value.trim();
    if (!txt) return;
    if (await gravar(sb.from("comentarios").insert({ cartao_id: editando.id, autor: meuNome, texto: txt }))) {
      $("cNovoComentario").value = "";
      carregarComentarios();
    }
  });

  // ---------- Administração ----------

  $("abrirAdmin").addEventListener("click", () => { desenharAdmin(); $("dlgAdmin").showModal(); });

  async function adminGravar(acao, ok) {
    const { error } = await acao;
    if (error) aviso("Erro: " + error.message, true);
    else if (ok) aviso(ok);
    await carregarTudo();
    desenharAdmin();
  }

  function linhaAdmin(nome, ...controles) {
    const d = document.createElement("div");
    const n = texto(nome);
    n.className = "nome";
    d.append(n, ...controles);
    return d;
  }

  function desenharAdmin() {
    const ap = $("aPessoas");
    ap.innerHTML = "";
    const pendenteAntes = m => (m.papel === "pendente" ? 0 : 1);
    [...membros].sort((a, b) => pendenteAntes(a) - pendenteAntes(b)).forEach(m => {
      const papel = document.createElement("select");
      papel.append(new Option("Aguardando", "pendente"), new Option("Membro", "membro"), new Option("Admin", "admin"));
      papel.value = m.papel;
      papel.disabled = m.email === eu;
      papel.addEventListener("change", () =>
        adminGravar(sb.from("membros").update({ papel: papel.value }).eq("email", m.email), "Acesso atualizado"));
      const remover = botao("Remover", () => {
        if (confirm("Remover " + (m.nome || m.email) + "? A pessoa perde o acesso."))
          adminGravar(sb.from("membros").delete().eq("email", m.email), "Membro removido");
      }, "perigo");
      remover.disabled = m.email === eu;
      const rotulo = (m.nome ? m.nome + " — " : "") + m.email + (m.papel === "pendente" ? " ⏳" : "");
      ap.append(linhaAdmin(rotulo, papel, remover));
    });

    const ac = $("aCampanhas");
    ac.innerHTML = "";
    campanhas.forEach(c => {
      ac.append(linhaAdmin(c.nome + (c.arquivada ? " (arquivada)" : ""),
        botao(c.arquivada ? "Reativar" : "Arquivar", () =>
          adminGravar(sb.from("campanhas").update({ arquivada: !c.arquivada }).eq("id", c.id)))));
    });

    const at = $("aTipos");
    at.innerHTML = "";
    tipos.forEach(t => {
      const etapas = document.createElement("input");
      etapas.value = t.checklist.join(", ");
      etapas.style.flex = "2";
      etapas.title = "Etapas padrão, separadas por vírgula";
      etapas.addEventListener("change", () =>
        adminGravar(sb.from("tipos").update({ checklist: separar(etapas.value) }).eq("id", t.id), "Tipo atualizado"));
      const cor = document.createElement("input");
      cor.type = "color";
      cor.value = t.cor;
      cor.addEventListener("change", () =>
        adminGravar(sb.from("tipos").update({ cor: cor.value }).eq("id", t.id)));
      const excluir = botao("✕", () => {
        if (confirm("Excluir o tipo " + t.nome + "? Os cartões ficam sem tipo."))
          adminGravar(sb.from("tipos").delete().eq("id", t.id));
      }, "perigo");
      at.append(linhaAdmin(t.nome, cor, etapas, excluir));
    });
  }

  $("aFormCampanha").addEventListener("submit", e => {
    e.preventDefault();
    adminGravar(sb.from("campanhas").insert({ nome: $("aCampNome").value.trim(), cor: $("aCampCor").value }), "Campanha criada");
    e.target.reset();
  });

  $("aFormTipo").addEventListener("submit", e => {
    e.preventDefault();
    adminGravar(sb.from("tipos").insert({
      nome: $("aTipoNome").value.trim(),
      cor: $("aTipoCor").value,
      checklist: separar($("aTipoCheck").value),
    }), "Tipo criado");
    e.target.reset();
  });

  $("aExportar").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify({ membros, tipos, campanhas, cartoes }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "kanban-backup-" + hoje() + ".json";
    a.click();
    URL.revokeObjectURL(a.href);
  });
</script>
</body>
</html>
